{% extends "base.html" %}

{% block title %}Đổi Mật Khẩu - Green Corner{% endblock %}

{% block content %}
<section class="commerce-page py-5">
    <div class="container" style="max-width: 500px;">
        <div class="cart-table-wrapper checkout-card p-4 p-md-5">
            <h4 class="fw-bold text-white mb-3">Đổi Mật Khẩu</h4>

            <form method="post" action="{{ url_for('auth.change_password') }}">
                <div class="mb-3">
                    <label class="form-label text-white small fw-semibold">Mật khẩu hiện tại</label>
                    <input type="password" name="current_password" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label text-white small fw-semibold">Mật khẩu mới</label>
                    <input type="password" name="new_password" class="form-control" minlength="6" required />
                </div>

                <div class="mb-4">
                    <label class="form-label text-white small fw-semibold">Xác nhận mật khẩu mới</label>
                    <input type="password" name="confirm_password" class="form-control" minlength="6" required />
                </div>

                <div class="d-flex justify-content-between align-items-center pt-2">
                    <a href="{{ url_for('auth.profile') }}" class="btn btn-outline-secondary rounded-pill px-4">
                        Quay lại
                    </a>
                    <button type="submit" class="btn btn-green rounded-pill px-4">
                        Cập Nhật
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
