{% extends "admin/base.html" %}

{% block title %}Chỉnh Sửa Sản Phẩm - Green Corner Admin{% endblock %}
{% block page_title %}Chỉnh sửa: {{ product.product_name }}{% endblock %}

{% block content %}
<div class="admin-panel" style="max-width: 800px;">
    <form method="post" action="{{ url_for('admin.edit_product', product_id=product.product_id) }}">
        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label class="form-label small fw-semibold text-white">Tên sản phẩm cây cảnh <span class="text-danger">*</span></label>
                <input type="text" name="product_name" class="form-control" required value="{{ product.product_name }}" />
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-semibold text-white">Danh mục <span class="text-danger">*</span></label>
                <select name="category_id" class="form-select" required>
                    {% for cat in categories %}
                        <option value="{{ cat.category_id }}" {% if product.category_id == cat.category_id %}selected{% endif %}>
                            {{ cat.category_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label small fw-semibold text-white">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                <input type="number" name="price" class="form-control" required min="1000" step="1000" value="{{ int(product.price) }}" />
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-semibold text-white">Số lượng tồn kho <span class="text-danger">*</span></label>
                <input type="number" name="quantity" class="form-control" required min="0" value="{{ product.quantity }}" />
            </div>
        </div>

        <div class="row g-3 mb-3 align-items-center">
            <div class="col-md-9">
                <label class="form-label small fw-semibold text-white">Đường dẫn hình ảnh</label>
                <input type="text" name="image_url" class="form-control" value="{{ product.image_url }}" />
            </div>
            <div class="col-md-3 text-center">
                <img src="{{ product.image_url }}" alt="Preview" class="rounded-3 border border-secondary" style="width: 60px; height: 60px; object-fit: cover;" />
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-white">Mô tả chi tiết</label>
            <textarea name="description" rows="4" class="form-control">{{ product.description }}</textarea>
        </div>

        <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" name="is_active" id="isActiveSwitch" {% if product.is_active %}checked{% endif %}>
            <label class="form-check-label fw-semibold text-white" for="isActiveSwitch">Kích hoạt hiển thị sản phẩm trên cửa hàng</label>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary rounded-pill px-4">Hủy bỏ</a>
            <button type="submit" class="btn btn-green rounded-pill px-4">Lưu Cập Nhật</button>
        </div>
    </form>
</div>
{% endblock %}
